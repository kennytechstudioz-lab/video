[phases.setup]
nixPkgs = ["python310", "ffmpeg", "libGL", "glib"]

[phases.build]
cmds = [
    "pip install --upgrade pip",
    "pip install -r requirements.txt",
    "python -c 'from nudenet import NudeDetector; NudeDetector()'"
]

[start]
cmd = "gunicorn -w 1 --threads 2 -b 0.0.0.0:$PORT --timeout 180 main:app"
